name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate site
        env:
          # NETWORK_STATUS stays "prelaunch" until LIVE Backstage onboarding is
          # approved and the contract accepted. Flip the repo variable to "live"
          # only then — see README.
          NETWORK_STATUS: ${{ vars.NETWORK_STATUS }}
          # Second key for the same door: live copy claims a TikTok partnership,
          # so the generator also needs the approval named here. Empty -> the
          # build degrades to prelaunch and annotates the run.
          BACKSTAGE_APPROVAL: ${{ vars.BACKSTAGE_APPROVAL }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          # Required while served from github.io/<repo>/. Clear it when a custom
          # domain at the apex is configured, or internal links will double up.
          BASE_PATH: ${{ vars.BASE_PATH }}
          GA4_MEASUREMENT_ID: ${{ vars.GA4_MEASUREMENT_ID }}
          DISCORD_INVITE: ${{ vars.DISCORD_INVITE }}
          # POST target for the /managers/ form; unset -> mailto fallback.
          FORM_ENDPOINT: ${{ vars.FORM_ENDPOINT }}
        run: python3 generate_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
