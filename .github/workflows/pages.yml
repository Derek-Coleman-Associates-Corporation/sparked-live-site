name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate site
        env:
          # NETWORK_STATUS stays "prelaunch" until LIVE Backstage onboarding is
          # approved and the contract accepted. Flip the repo variable to "live"
          # only then — see README.
          NETWORK_STATUS: ${{ vars.NETWORK_STATUS }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          GA4_MEASUREMENT_ID: ${{ vars.GA4_MEASUREMENT_ID }}
          DISCORD_INVITE: ${{ vars.DISCORD_INVITE }}
        run: python3 generate_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
